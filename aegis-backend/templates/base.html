<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AEGIS // {% block title %}Scanner{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
</head>
<body>

  <!-- Matrix rain canvas (background) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Navbar -->
  <nav class="top-nav">
    <div class="nav-left">
      <span class="nav-logo">
        <span class="logo-bracket">[</span>
        <i class="fa fa-shield-halved"></i>
        <span class="logo-name">AEGIS</span>
        <span class="logo-bracket">]</span>
      </span>
      <span class="nav-status">
        <span class="status-dot"></span>
        SYSTEM ONLINE
      </span>
    </div>
    <div class="nav-right">
      <span class="nav-mono">v1.0.0 // B.Tech Cybersecurity</span>
      <a href="/" class="nav-btn {% if request.path == '/' %}active{% endif %}">
        <i class="fa fa-terminal me-1"></i>HOME
      </a>
    </div>
  </nav>

  <!-- Main -->
  <main>{% block content %}{% endblock %}</main>

  <!-- Footer -->
  <footer class="bottom-bar">
    <span class="mono-text">AEGIS // Automated Network Vulnerability Scanner</span>
    <span class="mono-text muted-text">[ B.Tech Cybersecurity — 2nd Year Mini Project ]</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='js/matrix.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
